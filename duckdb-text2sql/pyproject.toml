[project]
name = "duckdb-text2sql"
version = "0.1.0"
description = "Small, execution-verified text-to-SQL models for DuckDB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=26.0.1",
    "sqlglot>=30.35.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text2sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
